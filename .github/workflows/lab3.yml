name: Two Lab 3 experiments
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Prepare generic experiment sources
      shell: python
      run: |
        import json, os
        from pathlib import Path
        files=json.loads('{"make_plans.py": "import json, os\\nfrom pathlib import Path\\nimport xml.etree.ElementTree as E\\n\\nOUT=Path(\'out/performance\');(OUT/\'plans\').mkdir(parents=True,exist_ok=True)\\nP=os.environ[\'WEBUI_PROJECT_NAME\']\\ndef prop(parent,name,value,kind=\'stringProp\'):\\n    e=E.SubElement(parent,kind,name=name);e.text=str(value).lower() if isinstance(value,bool) else str(value);return e\\ndef pair(parent,tag,gui,name,**kwargs):\\n    e=E.SubElement(parent,tag,guiclass=gui,testclass=tag,testname=name,enabled=\'true\',**kwargs)\\n    h=E.SubElement(parent,\'hashTree\');return e,h\\ndef assertion(tree,name,field,pattern,mode=2):\\n    a,_=pair(tree,\'ResponseAssertion\',\'AssertionGui\',name)\\n    c=E.SubElement(a,\'collectionProp\',name=\'Asserion.test_strings\');prop(c,\'0\',pattern)\\n    prop(a,\'Assertion.custom_message\',\'\');prop(a,\'Assertion.test_field\',field)\\n    prop(a,\'Assertion.assume_success\',False,\'boolProp\');prop(a,\'Assertion.test_type\',mode,\'intProp\')\\ndef sampler(tree,name,host,path=\'/\',method=\'GET\',args=None,body=None):\\n    s,h=pair(tree,\'HTTPSamplerProxy\',\'HttpTestSampleGui\',name)\\n    a=E.SubElement(s,\'elementProp\',name=\'HTTPsampler.Arguments\',elementType=\'Arguments\',guiclass=\'HTTPArgumentsPanel\',testclass=\'Arguments\',enabled=\'true\')\\n    coll=E.SubElement(a,\'collectionProp\',name=\'Arguments.arguments\')\\n    for key,value in (args or {}).items():\\n        x=E.SubElement(coll,\'elementProp\',name=key,elementType=\'HTTPArgument\')\\n        prop(x,\'HTTPArgument.always_encode\',True,\'boolProp\');prop(x,\'Argument.value\',value)\\n        prop(x,\'Argument.metadata\',\'=\');prop(x,\'HTTPArgument.use_equals\',True,\'boolProp\');prop(x,\'Argument.name\',key)\\n    for key,val in {\'domain\':host,\'port\':\'\',\'protocol\':\'https\',\'contentEncoding\':\'UTF-8\',\'path\':path,\'method\':method,\\n                    \'connect_timeout\':\'10000\',\'response_timeout\':\'20000\',\'implementation\':\'HttpClient4\'}.items(): prop(s,\'HTTPSampler.\'+key,val)\\n    for key,val in {\'follow_redirects\':True,\'auto_redirects\':False,\'use_keepalive\':True,\'DO_MULTIPART_POST\':False,\'image_parser\':False}.items():prop(s,\'HTTPSampler.\'+key,val,\'boolProp\')\\n    assertion(h,\'HTTP\\u72b6\\u6001\\u7801\\u4e3a200\',\'Assertion.response_code\',\'200\',8)\\n    if body:assertion(h,\'\\u54cd\\u5e94\\u6b63\\u6587\\u5185\\u5bb9\\u68c0\\u67e5\',\'Assertion.response_data\',body)\\n    return h\\ndef listener(tree,gui,name,filename=\'\'):\\n    r,_=pair(tree,\'ResultCollector\',gui,name)\\n    prop(r,\'ResultCollector.error_logging\',False,\'boolProp\')\\n    obj=E.SubElement(r,\'objProp\');E.SubElement(obj,\'name\').text=\'saveConfig\';v=E.SubElement(obj,\'value\',{\'class\':\'SampleSaveConfiguration\'})\\n    for key in [\'time\',\'latency\',\'timestamp\',\'success\',\'label\',\'code\',\'message\',\'threadName\',\'dataType\',\'encoding\',\'assertions\',\'subresults\',\'responseData\',\'samplerData\',\'xml\',\'fieldNames\',\'responseHeaders\',\'requestHeaders\',\'responseDataOnError\',\'bytes\',\'sentBytes\',\'url\',\'threadCounts\',\'idleTime\',\'connectTime\']:\\n        E.SubElement(v,key).text=\'true\'\\n    E.SubElement(v,\'assertionsResultsToSave\').text=\'0\';prop(r,\'filename\',filename)\\ndef plan(phase):\\n    root=E.Element(\'jmeterTestPlan\',version=\'1.2\',properties=\'5.0\',jmeter=\'5.6.3\');tree=E.SubElement(root,\'hashTree\')\\n    test,th=pair(tree,\'TestPlan\',\'TestPlanGui\',P+\' \\u6027\\u80fd\\u6d4b\\u8bd5 \'+phase)\\n    prop(test,\'TestPlan.functional_mode\',False,\'boolProp\');prop(test,\'TestPlan.serialize_threadgroups\',False,\'boolProp\')\\n    a=E.SubElement(test,\'elementProp\',name=\'TestPlan.user_defined_variables\',elementType=\'Arguments\',guiclass=\'ArgumentsPanel\',testclass=\'Arguments\',enabled=\'true\');E.SubElement(a,\'collectionProp\',name=\'Arguments.arguments\')\\n    tg,t=pair(th,\'ThreadGroup\',\'ThreadGroupGui\',P+\' \\u7ebf\\u7a0b\\u7ec4\')\\n    prop(tg,\'ThreadGroup.on_sample_error\',\'continue\')\\n    loop=E.SubElement(tg,\'elementProp\',name=\'ThreadGroup.main_controller\',elementType=\'LoopController\',guiclass=\'LoopControlPanel\',testclass=\'LoopController\',enabled=\'true\')\\n    prop(loop,\'LoopController.continue_forever\',False,\'boolProp\');prop(loop,\'LoopController.loops\',3 if phase==\'baidu\' else 1)\\n    prop(tg,\'ThreadGroup.num_threads\',1 if phase==\'baidu\' else 3);prop(tg,\'ThreadGroup.ramp_time\',3 if phase==\'baidu\' else 5)\\n    prop(tg,\'ThreadGroup.scheduler\',False,\'boolProp\');prop(tg,\'ThreadGroup.same_user_on_next_iteration\',True,\'boolProp\')\\n    timer,_=pair(t,\'ConstantTimer\',\'ConstantTimerGui\',\'\\u8bf7\\u6c42\\u95f4\\u9694\');prop(timer,\'ConstantTimer.delay\',2000 if phase==\'baidu\' else 300)\\n    if phase==\'baidu\':\\n        name=P+\' \\u767e\\u5ea6\\u641c\\u7d22 GET\';h=sampler(t,name,\'www.baidu.com\',\'/s\',\'GET\',{\'wd\':\'\\u8f6f\\u4ef6\\u6d4b\\u8bd5\',\'ie\':\'utf-8\'},\'\\u8f6f\\u4ef6\\u6d4b\\u8bd5\')\\n        assertion(h,\'\\u54cd\\u5e94\\u4e0d\\u5f97\\u662f\\u5b89\\u5168\\u9a8c\\u8bc1\\u9875\',\'Assertion.response_data\',\'(?i)\\u767e\\u5ea6\\u5b89\\u5168\\u9a8c\\u8bc1|\\u5b89\\u5168\\u9a8c\\u8bc1|verify.{0,20}human|captcha\',6)\\n    else:\\n        name=P+\' \\u9996\\u9875 GET\';sampler(t,name,\'blazedemo.com\',body=\'BlazeDemo\')\\n        if phase==\'second\':\\n            name=P+\' \\u822a\\u7ebf\\u67e5\\u8be2 POST\';sampler(t,name,\'blazedemo.com\',\'/reserve.php\',\'POST\',{\'fromPort\':\'Boston\',\'toPort\':\'London\'},\'Flights from Boston to London\')\\n    xmlfile=(OUT/(phase+\'-results.jtl\')).resolve().as_posix()\\n    listener(t,\'ViewResultsFullVisualizer\',P+\' \\u7ed3\\u679c\\u6811\',\'${__P(lab.results,\'+phase+\'-results.jtl)}\')\\n    listener(t,\'SummaryReport\',P+\' \\u6c47\\u603b\\u62a5\\u544a\')\\n    if phase==\'second\':listener(t,\'TableVisualizer\',P+\' \\u7ed3\\u679c\\u8868\\u683c\')\\n    dest=OUT/\'plans\'/(phase+\'.jmx\');E.indent(root,space=\'  \');E.ElementTree(root).write(dest,encoding=\'utf-8\',xml_declaration=True)\\n    return {\'phase\':phase,\'jmx\':str(dest.resolve()),\'sample_name\':name,\'result_file\':xmlfile,\'expected_samples\':3 if phase!=\'second\' else 6}\\nspec=[plan(p) for p in [\'first\',\'second\',\'baidu\']]\\n(OUT/\'plans.json\').write_text(json.dumps(spec,ensure_ascii=False,indent=2))\\nprint(\'Three JMeter plans generated; maximum scheduled main samples: 12.\')\\n", "prepare_emulator.sh": "#!/usr/bin/env bash\\nset -euo pipefail\\nmkdir -p out/android\\nsdk_root=\\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\\"\\nexport PATH=\\"$sdk_root/cmdline-tools/latest/bin:$sdk_root/emulator:$sdk_root/platform-tools:$PATH\\"\\nsdkmanager \'platforms;android-35\' \'build-tools;35.0.0\' \'emulator\' \'system-images;android-30;google_apis;x86_64\' >out/android/sdk-install.log 2>&1\\nprintf \'no\\\\n\' | avdmanager create avd --force --name Lab3Contacts --package \'system-images;android-30;google_apis;x86_64\' --device pixel_2 >out/android/avd-create.log 2>&1\\nif [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then sudo setfacl -m \\"u:$(id -un):rw\\" /dev/kvm; fi\\nemulator -avd Lab3Contacts -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -camera-front none >out/android/emulator.log 2>&1 &\\nemu_pid=$!\\nprintf \'%s\\\\n\' \\"$emu_pid\\" >out/android/emulator.pid\\nfor i in $(seq 1 180); do\\n  boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d \'\\\\r\' || true)\\n  if [ \\"$boot\\" = 1 ]; then\\n    adb shell input keyevent 82\\n    adb install -r out/android/ContactsLab-debug.apk >out/android/install.log\\n    python android_test.py\\n    exit 0\\n  fi\\n  if ! kill -0 \\"$emu_pid\\" 2>/dev/null; then echo \'Android emulator exited before boot\'; exit 1; fi\\n  if [ $((i % 15)) -eq 0 ]; then echo \'Waiting for actual Android boot...\'; fi\\n  sleep 2\\ndone\\necho \'Android boot timed out\'; exit 1\\n", "LabGuiCapture.java": "import java.awt.*;\\nimport java.awt.event.ActionEvent;\\nimport java.awt.image.BufferedImage;\\nimport java.nio.charset.StandardCharsets;\\nimport java.nio.file.*;\\nimport java.util.*;\\nimport javax.imageio.ImageIO;\\nimport javax.swing.*;\\nimport javax.swing.tree.*;\\nimport org.apache.jmeter.JMeter;\\nimport org.apache.jmeter.gui.GuiPackage;\\nimport org.apache.jmeter.gui.action.ActionNames;\\nimport org.apache.jmeter.gui.action.ActionRouter;\\nimport org.apache.jmeter.gui.tree.JMeterTreeNode;\\nimport org.apache.jmeter.samplers.SampleResult;\\nimport org.apache.jmeter.testelement.TestElement;\\nimport org.apache.jmeter.util.JMeterUtils;\\n\\n/** Drives the actual Apache JMeter Swing UI and captures its native rendering. */\\npublic class LabGuiCapture {\\n    static GuiPackage gui;\\n    static JFrame frame;\\n    static String project=System.getenv(\\"WEBUI_PROJECT_NAME\\");\\n    static Path out=Paths.get(\\"out\\",\\"performance\\");\\n    static void edt(Runnable r) throws Exception { SwingUtilities.invokeAndWait(r); }\\n    static void choose(String name) throws Exception {\\n        edt(() -> {\\n            JTree tree=gui.getTreeListener().getJTree();\\n            DefaultMutableTreeNode root=(DefaultMutableTreeNode)tree.getModel().getRoot();\\n            Enumeration<?> all=root.depthFirstEnumeration();\\n            while (all.hasMoreElements()) {\\n                DefaultMutableTreeNode node=(DefaultMutableTreeNode)all.nextElement();\\n                Object o=node.getUserObject();\\n                if (o instanceof TestElement && ((TestElement)o).getName().equals(name)) {\\n                    TreePath path=new TreePath(node.getPath());tree.expandPath(path.getParentPath());\\n                    tree.setSelectionPath(path);tree.scrollPathToVisible(path);return;\\n                }\\n            }\\n            throw new IllegalStateException(\\"Actual JMeter tree node not found\\");\\n        });\\n        Thread.sleep(800);\\n    }\\n    static java.util.List<Component> components(Container root) {\\n        java.util.List<Component> list=new ArrayList<>();\\n        for (Component c:root.getComponents()) {list.add(c);if(c instanceof Container)list.addAll(components((Container)c));}\\n        return list;\\n    }\\n    static void chooseSample(String label) throws Exception {\\n        edt(() -> {\\n            for (Component c:components(frame)) {\\n                if (!(c instanceof JTree) || c==gui.getTreeListener().getJTree()) continue;\\n                JTree tree=(JTree)c;\\n                Object r=tree.getModel().getRoot();if (!(r instanceof DefaultMutableTreeNode))continue;\\n                Enumeration<?> all=((DefaultMutableTreeNode)r).depthFirstEnumeration();\\n                while(all.hasMoreElements()) {\\n                    DefaultMutableTreeNode n=(DefaultMutableTreeNode)all.nextElement();Object o=n.getUserObject();\\n                    if (o instanceof SampleResult && ((SampleResult)o).getSampleLabel().equals(label)) {\\n                        TreePath p=new TreePath(n.getPath());tree.expandPath(p.getParentPath());tree.setSelectionPath(p);tree.scrollPathToVisible(p);return;\\n                    }\\n                }\\n            }\\n            throw new IllegalStateException(\\"Actual listener sample not found\\");\\n        });\\n        Thread.sleep(700);\\n    }\\n    static void capture(String name) throws Exception {\\n        Rectangle[] bounds={null},field={null};\\n        edt(() -> {\\n            bounds[0]=frame.getBounds();\\n            for(Component c:components(frame)) if (c instanceof JTextField && c.isShowing() && ((JTextField)c).getText().contains(project)) {\\n                Point p=c.getLocationOnScreen();Insets in=((JTextField)c).getInsets();FontMetrics fm=c.getFontMetrics(c.getFont());\\n                field[0]=new Rectangle(p.x+in.left,p.y+(c.getHeight()-fm.getHeight())/2,Math.min(c.getWidth(),fm.stringWidth(project)+4),fm.getHeight());break;\\n            }\\n        });\\n        if (field[0]==null)throw new IllegalStateException(\\"Project name must be visible in native GUI\\");\\n        Robot robot=new Robot();Dimension screen=Toolkit.getDefaultToolkit().getScreenSize();robot.mouseMove(screen.width-1,screen.height-1);Thread.sleep(600);\\n        BufferedImage image=robot.createScreenCapture(bounds[0]);ImageIO.write(image,\\"png\\",out.resolve(name+\\".png\\").toFile());\\n        Rectangle r=field[0],b=bounds[0];String meta=String.format(Locale.ROOT,\\n            \\"{\\\\\\"screenshot\\\\\\":\\\\\\"%s.png\\\\\\",\\\\\\"viewport\\\\\\":[%d,%d],\\\\\\"project_rect\\\\\\":{\\\\\\"x\\\\\\":%d,\\\\\\"y\\\\\\":%d,\\\\\\"width\\\\\\":%d,\\\\\\"height\\\\\\":%d}}\\",\\n            name,b.width,b.height,r.x-b.x,r.y-b.y,r.width,r.height);\\n        Files.writeString(out.resolve(name+\\".json\\"),meta,StandardCharsets.UTF_8);\\n    }\\n    public static void main(String[] args) throws Exception {\\n        try {\\n            Path home=Paths.get(args[0]);String phase=args[2],label=args[3];Path result=Paths.get(args[4]);\\n            Files.createDirectories(out);\\n            JMeterUtils.setJMeterHome(home.toString());\\n            new JMeter().start(new String[]{\\"-d\\",home.toString(),\\"-p\\",home.resolve(\\"bin/jmeter.properties\\").toString(),\\"-t\\",args[1],\\"-Jlanguage=en\\",\\"-Jlab.results=\\"+args[4],\\"-Jjmeter.save.saveservice.output_format=xml\\",\\"-j\\",out.resolve(phase+\\"-jmeter.log\\").toString()});\\n            long deadline=System.currentTimeMillis()+30000;\\n            while(GuiPackage.getInstance()==null && System.currentTimeMillis()<deadline)Thread.sleep(200);\\n            gui=GuiPackage.getInstance();if(gui==null)throw new IllegalStateException(\\"JMeter GUI did not initialize\\");\\n            frame=gui.getMainFrame();\\n            edt(() -> { Dimension d=Toolkit.getDefaultToolkit().getScreenSize();frame.setBounds(0,0,Math.min(d.width,1580),Math.min(d.height-45,930));frame.setVisible(true);frame.toFront(); });\\n            Thread.sleep(1000);choose(label);capture(phase+\\"-request\\");\\n            edt(() -> ActionRouter.getInstance().doActionNow(new ActionEvent(gui.getTreeListener().getJTree(),ActionEvent.ACTION_PERFORMED,ActionNames.ACTION_START)));\\n            deadline=System.currentTimeMillis()+120000;boolean ended=false;\\n            while(System.currentTimeMillis()<deadline) {\\n                if(Files.exists(result)) {String s=Files.readString(result);if(s.trim().endsWith(\\"</testResults>\\")){ended=true;break;}}\\n                Thread.sleep(250);\\n            }\\n            if(!ended)throw new IllegalStateException(\\"JMeter did not finish and close the actual result file\\");\\n            choose(project+\\" \\u7ed3\\u679c\\u6811\\");chooseSample(label);capture(phase+\\"-results\\");\\n            choose(project+\\" \\u6c47\\u603b\\u62a5\\u544a\\");capture(phase+\\"-summary\\");\\n            System.out.println(\\"Actual native JMeter GUI run and captures completed: \\"+phase);\\n            System.exit(0);\\n        } catch(Throwable e) {\\n            e.printStackTrace();\\n            try {Robot r=new Robot();Dimension d=Toolkit.getDefaultToolkit().getScreenSize();ImageIO.write(r.createScreenCapture(new Rectangle(d)),\\"png\\",out.resolve(\\"diagnostic-gui.png\\").toFile());}catch(Exception ignored){}\\n            System.exit(1);\\n        }\\n    }\\n}\\n", "performance_run.py": "import hashlib,json,os,subprocess,time,urllib.request,zipfile,math,csv,platform\\nfrom pathlib import Path\\nimport xml.etree.ElementTree as ET\\nimport win32api\\n\\nOUT=Path(\'out/performance\');OUT.mkdir(parents=True,exist_ok=True)\\nfor i in range(500):\\n    try:\\n        mode=win32api.EnumDisplaySettings(None,i)\\n    except Exception:break\\n    if mode.PelsWidth==1600 and mode.PelsHeight>=900:\\n        win32api.ChangeDisplaySettings(mode,0);break\\nurl=\'https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.zip\'\\narchive=Path(\'apache-jmeter-5.6.3.zip\')\\nurllib.request.urlretrieve(url,archive)\\nexpected=urllib.request.urlopen(url+\'.sha512\').read().decode().split()[0]\\nassert hashlib.sha512(archive.read_bytes()).hexdigest()==expected\\nwith zipfile.ZipFile(archive) as z:z.extractall(\'.\')\\nhome=Path(\'apache-jmeter-5.6.3\').resolve()\\ncp=os.pathsep.join([str(home/\'bin/ApacheJMeter.jar\'),str(home/\'lib/*\'),str(home/\'lib/ext/*\'),\'.\'])\\nsubprocess.run([\'javac\',\'-encoding\',\'UTF-8\',\'-cp\',cp,\'LabGuiCapture.java\'],check=True)\\nsubprocess.run([\'python\',\'make_plans.py\'],check=True)\\nspec=json.loads((OUT/\'plans.json\').read_text());runs=[]\\nfor s in spec:\\n    subprocess.run([\'java\',\'-Dfile.encoding=UTF-8\',\'-Djmeter.home=\'+str(home),\'-cp\',cp,\'LabGuiCapture\',str(home),s[\'jmx\'],s[\'phase\'],s[\'sample_name\'],s[\'result_file\']],check=True,timeout=180)\\n    root=ET.parse(s[\'result_file\']).getroot();samples=[x for x in root if x.tag in (\'httpSample\',\'sample\')]\\n    assert len(samples)==s[\'expected_samples\'],(s[\'phase\'],len(samples))\\n    values=[int(x.get(\'t\')) for x in samples];elapsed=(max(int(x.get(\'ts\'))+int(x.get(\'t\')) for x in samples)-min(int(x.get(\'ts\')) for x in samples))/1000\\n    rows=[{\'label\':x.get(\'lb\'),\'timestamp_ms\':x.get(\'ts\'),\'elapsed_ms\':x.get(\'t\'),\'latency_ms\':x.get(\'lt\'),\'connect_ms\':x.get(\'ct\'),\'response_code\':x.get(\'rc\'),\'success\':x.get(\'s\'),\'bytes\':x.get(\'by\')} for x in samples]\\n    with (OUT/(s[\'phase\']+\'-samples.csv\')).open(\'w\',newline=\'\',encoding=\'utf-8-sig\') as f:\\n        w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)\\n    error=sum(x.get(\'s\')!=\'true\' for x in samples)\\n    runs.append({\'phase\':s[\'phase\'],\'sample_count\':len(samples),\'error_count\':error,\'error_rate_percent\':100*error/len(samples),\\n        \'average_ms\':sum(values)/len(values),\'min_ms\':min(values),\'max_ms\':max(values),\'p90_nearest_rank_ms\':sorted(values)[math.ceil(.9*len(values))-1],\\n        \'duration_seconds\':elapsed,\'throughput_per_second\':len(samples)/elapsed if elapsed else None,\'response_codes\':sorted(set(x.get(\'rc\') for x in samples))})\\n(OUT/\'results.json\').write_text(json.dumps({\'project\':os.environ[\'WEBUI_PROJECT_NAME\'],\'tool\':\'Apache JMeter 5.6.3\',\'os\':platform.platform(),\\n    \'java\':subprocess.check_output([\'java\',\'-version\'],stderr=subprocess.STDOUT).decode(\'utf-8\',\'replace\'),\\n    \'executed_at_utc\':time.strftime(\'%Y-%m-%dT%H:%M:%SZ\',time.gmtime()),\'archive_sha512\':expected,\'runs\':runs},ensure_ascii=False,indent=2))\\nprint(\'Three real JMeter runs completed; raw XML and derived metrics retained.\')\\n", "android_test.py": "import json, os, re, subprocess, time\\nfrom pathlib import Path\\nimport xml.etree.ElementTree as ET\\n\\nOUT=Path(\'out/android\');OUT.mkdir(parents=True,exist_ok=True)\\nPKG=\'edu.lab3.contacts\'\\nstudent=os.environ[\'WEBUI_PROJECT_NAME\'][-3:]\\ndef adb(*args,raw=False):\\n    r=subprocess.run([\'adb\',*args],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=45)\\n    return r.stdout if raw else r.stdout.decode(\'utf-8\',\'replace\')\\ndef tree():\\n    adb(\'shell\',\'uiautomator\',\'dump\',\'/sdcard/lab-window.xml\')\\n    data=adb(\'exec-out\',\'cat\',\'/sdcard/lab-window.xml\')\\n    return ET.fromstring(data),data\\ndef wait(predicate,seconds=45):\\n    end=time.monotonic()+seconds\\n    while time.monotonic()<end:\\n        try:\\n            t,xml=tree();value=predicate(t,xml)\\n            if value is not None and value is not False:return value\\n        except (ET.ParseError,subprocess.CalledProcessError):pass\\n        time.sleep(.4)\\n    raise AssertionError(\'Expected actual Android UI state was not reached\')\\ndef tap(node):\\n    b=list(map(int,re.findall(r\'\\\\d+\',node.attrib[\'bounds\'])))\\n    adb(\'shell\',\'input\',\'tap\',str((b[0]+b[2])//2),str((b[1]+b[3])//2))\\ndef click_text(label):\\n    e=wait(lambda t,s: next((x for x in t.iter(\'node\') if x.get(\'text\')==label or x.get(\'content-desc\')==label),None));tap(e)\\ndef capture(name):\\n    (OUT/(name+\'.png\')).write_bytes(adb(\'exec-out\',\'screencap\',\'-p\',raw=True))\\n    _,s=tree();(OUT/(name+\'.xml\')).write_text(s)\\ndef permission_button(allow):\\n    def find(t,s):\\n        for e in t.iter(\'node\'):\\n            rid=e.get(\'resource-id\',\'\').lower();text=e.get(\'text\',\'\').lower()\\n            if allow and (\'permission_allow_button\' in rid or text in [\'allow\',\'\\u5141\\u8bb8\']):return e\\n            if not allow and (\'permission_deny_button\' in rid or text in [\'deny\',\'\\u62d2\\u7edd\',\'\\u4e0d\\u5141\\u8bb8\']):return e\\n        return None\\n    tap(wait(find))\\nchecks=[]\\ntry:\\n    adb(\'shell\',\'am\',\'start\',\'-n\',PKG+\'/.MainActivity\')\\n    wait(lambda t,s:\'\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\' in s);capture(\'01-initial\')\\n    click_text(\'\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\')\\n    wait(lambda t,s:\'permissioncontroller\' in s or \'packageinstaller\' in s);capture(\'02-permission-dialog\')\\n    permission_button(False)\\n    wait(lambda t,s:\'\\u6743\\u9650\\u88ab\\u62d2\\u7edd\' in s);capture(\'03-permission-denied\');checks.append({\'case\':\'Runtime permission denial\',\'passed\':True})\\n    click_text(\'\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\');permission_button(True)\\n    wait(lambda t,s:\'\\u6682\\u65e0\\u5e26\\u7535\\u8bdd\\u53f7\\u7801\\u7684\\u8054\\u7cfb\\u4eba\' in s and \'\\u8bfb\\u53d6\\u5b8c\\u6210\' in s);capture(\'04-empty-provider\');checks.append({\'case\':\'Granted permission with empty system contacts\',\'passed\':True})\\n    click_text(\'\\u65b0\\u5efa\\u7cfb\\u7edf\\u8054\\u7cfb\\u4eba\')\\n    wait(lambda t,s:student in s)\\n    ime=adb(\'shell\',\'dumpsys\',\'input_method\')\\n    if \'mInputShown=true\' in ime or \'mIsInputViewShown=true\' in ime: adb(\'shell\',\'input\',\'keyevent\',\'4\')\\n    wait(lambda t,s:student in s and \'1000000107\' in s);capture(\'05-system-contact-editor\')\\n    def save_control(t,s):\\n        for e in t.iter(\'node\'):\\n            text=e.get(\'text\',\'\').strip().lower();desc=e.get(\'content-desc\',\'\').strip().lower();rid=e.get(\'resource-id\',\'\')\\n            if text in [\'save\',\'\\u4fdd\\u5b58\'] or desc in [\'save\',\'\\u4fdd\\u5b58\'] or rid.endswith(\'/menu_save\'):return e\\n        return None\\n    tap(wait(save_control))\\n    time.sleep(1)\\n    adb(\'shell\',\'am\',\'start\',\'-n\',PKG+\'/.MainActivity\')\\n    wait(lambda t,s:student in s and \'1000000107\' in s and \'\\u5df2\\u52a0\\u8f7d 1 \\u6761\\u7535\\u8bdd\\u53f7\\u7801\' in s)\\n    capture(\'06-real-provider-contact\');checks.append({\'case\':\'Real system contact read by ContentResolver\',\'passed\':True})\\n    click_text(\'\\u53d1\\u9001\\u5237\\u65b0\\u5e7f\\u64ad\')\\n    wait(lambda t,s:\'\\u5e7f\\u64ad\\u63a5\\u6536 1 \\u6b21\' in s and \'\\u6536\\u5230\\u5e94\\u7528\\u5185\\u5237\\u65b0\\u5e7f\\u64ad\' in s and \'\\u8bfb\\u53d6\\u5b8c\\u6210\' in s)\\n    capture(\'07-refresh-broadcast\');checks.append({\'case\':\'In-app BroadcastReceiver refresh\',\'passed\':True})\\n    info={\'project\':os.environ[\'WEBUI_PROJECT_NAME\'],\'android_release\':adb(\'shell\',\'getprop\',\'ro.build.version.release\').strip(),\\n          \'api_level\':adb(\'shell\',\'getprop\',\'ro.build.version.sdk\').strip(),\'device\':adb(\'shell\',\'getprop\',\'ro.product.model\').strip(),\\n          \'executed_at_utc\':time.strftime(\'%Y-%m-%dT%H:%M:%SZ\',time.gmtime()),\'checks\':checks,\'contact_name\':student,\'contact_number\':\'1000000107\'}\\n    (OUT/\'results.json\').write_text(json.dumps(info,ensure_ascii=False,indent=2))\\n    (OUT/\'package-permissions.txt\').write_text(adb(\'shell\',\'dumpsys\',\'package\',PKG))\\n    print(\'Four actual Android functional checks passed.\',flush=True)\\nexcept Exception:\\n    capture(\'diagnostic-failure\')\\n    (OUT/\'logcat.txt\').write_text(adb(\'logcat\',\'-d\',\'-t\',\'600\'))\\n    raise\\n", "android_build.py": "from pathlib import Path\\nimport hashlib,html,json,os,shutil,subprocess,urllib.request,zipfile\\n\\nroot=Path(\'ContactsLab\');out=Path(\'out/android\');out.mkdir(parents=True,exist_ok=True)\\nP=os.environ[\'WEBUI_PROJECT_NAME\'];s=root/\'app/src/main/res/values/strings.xml\'\\ns.write_text(s.read_text().replace(\'@PROJECT_NAME@\',html.escape(P)).replace(\'@STUDENT_NAME@\',html.escape(P[-3:])))\\nurl=\'https://services.gradle.org/distributions/gradle-8.9-bin.zip\';dest=Path(\'gradle-8.9-bin.zip\')\\nurllib.request.urlretrieve(url,dest)\\nexpected=urllib.request.urlopen(url+\'.sha256\').read().decode().strip().split()[0]\\nassert hashlib.sha256(dest.read_bytes()).hexdigest()==expected\\nwith zipfile.ZipFile(dest) as z:z.extractall(\'.\')\\ngradle=Path(\'gradle-8.9/bin/gradle\').resolve();gradle.chmod(0o755)\\nsubprocess.run([str(gradle),\'--no-daemon\',\'wrapper\',\'--gradle-version\',\'8.9\',\'--distribution-type\',\'bin\',\'assembleDebug\'],cwd=root,check=True)\\nshutil.copyfile(root/\'app/build/outputs/apk/debug/app-debug.apk\',out/\'ContactsLab-debug.apk\')\\nwith zipfile.ZipFile(out/\'ContactsLab-source.zip\',\'w\',zipfile.ZIP_DEFLATED) as z:\\n    for p in root.rglob(\'*\'):\\n        rel=p.relative_to(root)\\n        if p.is_file() and \'.gradle\' not in rel.parts and \'build\' not in rel.parts and p.name!=\'local.properties\':z.write(p,Path(\'ContactsLab\')/rel)\\nprint(\'Actual Android debug APK built; complete importable source archived.\')\\n", "ContactsLab/build.gradle": "plugins { id \'com.android.application\' version \'8.7.3\' apply false }\\n", "ContactsLab/gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\\nandroid.useAndroidX=false\\n", "ContactsLab/settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\\nrootProject.name = \'ContactsLab\'\\ninclude \':app\'\\n", "ContactsLab/app/build.gradle": "plugins { id \'com.android.application\' }\\nandroid {\\n    namespace \'edu.lab3.contacts\'\\n    compileSdk 35\\n    defaultConfig { applicationId \'edu.lab3.contacts\'; minSdk 26; targetSdk 35; versionCode 1; versionName \'1.0\' }\\n    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }\\n}\\n", "ContactsLab/app/src/main/AndroidManifest.xml": "<?xml version=\\"1.0\\" encoding=\\"utf-8\\"?>\\n<manifest xmlns:android=\\"http://schemas.android.com/apk/res/android\\">\\n    <uses-permission android:name=\\"android.permission.READ_CONTACTS\\" />\\n    <application android:theme=\\"@android:style/Theme.Material.Light.NoActionBar\\" android:label=\\"\\u8054\\u7cfb\\u4eba\\u8bfb\\u53d6\\u5b9e\\u9a8c\\" android:allowBackup=\\"false\\" android:supportsRtl=\\"true\\">\\n        <activity android:name=\\".MainActivity\\" android:exported=\\"true\\">\\n            <intent-filter>\\n                <action android:name=\\"android.intent.action.MAIN\\" />\\n                <category android:name=\\"android.intent.category.LAUNCHER\\" />\\n            </intent-filter>\\n        </activity>\\n    </application>\\n</manifest>\\n", "ContactsLab/app/src/main/res/values/strings.xml": "<?xml version=\\"1.0\\" encoding=\\"utf-8\\"?>\\n<resources>\\n    <string name=\\"project_name\\">@PROJECT_NAME@</string>\\n    <string name=\\"student_name\\">@STUDENT_NAME@</string>\\n</resources>\\n", "ContactsLab/app/src/main/java/edu/lab3/contacts/MainActivity.java": "package edu.lab3.contacts;\\n\\nimport android.Manifest;\\nimport android.app.Activity;\\nimport android.content.ActivityNotFoundException;\\nimport android.content.BroadcastReceiver;\\nimport android.content.Context;\\nimport android.content.Intent;\\nimport android.content.IntentFilter;\\nimport android.content.pm.PackageManager;\\nimport android.database.ContentObserver;\\nimport android.database.Cursor;\\nimport android.graphics.Color;\\nimport android.os.Build;\\nimport android.os.Bundle;\\nimport android.os.Handler;\\nimport android.os.Looper;\\nimport android.provider.ContactsContract;\\nimport android.view.View;\\nimport android.widget.Button;\\nimport android.widget.LinearLayout;\\nimport android.widget.ListView;\\nimport android.widget.SimpleAdapter;\\nimport android.widget.TextView;\\nimport java.util.ArrayList;\\nimport java.util.HashMap;\\nimport java.util.HashSet;\\nimport java.util.concurrent.ExecutorService;\\nimport java.util.concurrent.Executors;\\n\\n/** Reads actual system Contacts Provider rows. No embedded contact data. */\\npublic class MainActivity extends Activity {\\n    private static final int REQUEST_CONTACTS = 107;\\n    private static final String ACTION_REFRESH = \\"edu.lab3.contacts.REFRESH_CONTACTS\\";\\n    private final ExecutorService worker = Executors.newSingleThreadExecutor();\\n    private final Handler main = new Handler(Looper.getMainLooper());\\n    private final ArrayList<HashMap<String,String>> rows = new ArrayList<>();\\n    private SimpleAdapter adapter;\\n    private TextView status, counts, empty;\\n    private int broadcasts;\\n    private boolean observerRegistered;\\n    private boolean destroyed;\\n    private final ContentObserver observer = new ContentObserver(main) {\\n        @Override public void onChange(boolean selfChange) {\\n            if (allowed()) loadContacts(\\"\\u7cfb\\u7edf\\u6570\\u636e\\u53d8\\u5316\\uff0c\\u81ea\\u52a8\\u5237\\u65b0\\");\\n        }\\n    };\\n    private final BroadcastReceiver refreshReceiver = new BroadcastReceiver() {\\n        @Override public void onReceive(Context context, Intent intent) {\\n            if (ACTION_REFRESH.equals(intent.getAction())) {\\n                broadcasts++;\\n                updateCount();\\n                if (allowed()) loadContacts(\\"\\u6536\\u5230\\u5e94\\u7528\\u5185\\u5237\\u65b0\\u5e7f\\u64ad\\");\\n                else status.setText(\\"\\u5df2\\u6536\\u5230\\u5237\\u65b0\\u5e7f\\u64ad\\uff1b\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\u4ecd\\u9700\\u5148\\u6388\\u6743\\u3002\\");\\n            }\\n        }\\n    };\\n\\n    @Override public void onCreate(Bundle savedInstanceState) {\\n        super.onCreate(savedInstanceState);\\n        getWindow().setStatusBarColor(Color.rgb(22,72,124));\\n        getWindow().setNavigationBarColor(Color.rgb(22,72,124));\\n        LinearLayout root = new LinearLayout(this);\\n        root.setOrientation(LinearLayout.VERTICAL);\\n        root.setPadding(dp(18), dp(20), dp(18), dp(12));\\n        root.setBackgroundColor(Color.rgb(244,247,251));\\n        TextView title = label(\\"\\u5185\\u5bb9\\u63d0\\u4f9b\\u5668\\u4e0e\\u5e7f\\u64ad\\",24,Color.rgb(20,55,91));\\n        title.setTypeface(null,1); root.addView(title);\\n        root.addView(label(getString(R.string.project_name),15,Color.DKGRAY));\\n        root.addView(label(\\"\\u8bfb\\u53d6\\u7cfb\\u7edf\\u8054\\u7cfb\\u4eba \\u00b7 \\u59d3\\u540d\\u4e0e\\u7535\\u8bdd\\u53f7\\u7801\\",14,Color.DKGRAY));\\n        status=label(\\"\\u5c1a\\u672a\\u6388\\u6743\\uff0c\\u8bf7\\u70b9\\u51fb\\u201c\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\u201d\\u3002\\",15,Color.rgb(36,78,121));\\n        status.setId(1001); status.setPadding(0,dp(16),0,dp(8)); root.addView(status);\\n        Button read=new Button(this); read.setText(\\"\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\"); read.setId(1002);\\n        read.setOnClickListener(v -> requestAndLoad()); root.addView(read);\\n        Button add=new Button(this); add.setText(\\"\\u65b0\\u5efa\\u7cfb\\u7edf\\u8054\\u7cfb\\u4eba\\"); add.setId(1003);\\n        add.setOnClickListener(v -> createContact()); root.addView(add);\\n        Button refresh=new Button(this); refresh.setText(\\"\\u53d1\\u9001\\u5237\\u65b0\\u5e7f\\u64ad\\"); refresh.setId(1004);\\n        refresh.setOnClickListener(v -> sendBroadcast(new Intent(ACTION_REFRESH).setPackage(getPackageName())));\\n        root.addView(refresh);\\n        counts=label(\\"\\",14,Color.DKGRAY);counts.setId(1005);counts.setPadding(0,dp(12),0,dp(8));root.addView(counts);\\n        ListView list=new ListView(this);list.setId(1006);list.setBackgroundColor(Color.WHITE);\\n        adapter=new SimpleAdapter(this,rows,android.R.layout.simple_list_item_2,\\n                new String[]{\\"name\\",\\"phone\\"},new int[]{android.R.id.text1,android.R.id.text2});\\n        list.setAdapter(adapter);root.addView(list,new LinearLayout.LayoutParams(-1,0,1));\\n        empty=label(\\"\\u6682\\u65e0\\u6570\\u636e\\u3002\\u6388\\u6743\\u540e\\u8bfb\\u53d6\\uff0c\\u6216\\u5148\\u65b0\\u5efa\\u8054\\u7cfb\\u4eba\\u3002\\",15,Color.GRAY);\\n        empty.setPadding(dp(8),dp(16),dp(8),dp(16));root.addView(empty);\\n        list.setEmptyView(empty);\\n        root.addView(label(\\"\\u7cfb\\u7edf\\u901a\\u8baf\\u5f55 \\u2192 ContentResolver \\u2192 \\u5f53\\u524d\\u5217\\u8868\\",12,Color.GRAY));\\n        setContentView(root); updateCount();\\n        IntentFilter filter=new IntentFilter(ACTION_REFRESH);\\n        if (Build.VERSION.SDK_INT>=33) registerReceiver(refreshReceiver,filter,Context.RECEIVER_NOT_EXPORTED);\\n        else registerReceiver(refreshReceiver,filter);\\n    }\\n    private TextView label(String text,int size,int color) {\\n        TextView t=new TextView(this);t.setText(text);t.setTextSize(size);t.setTextColor(color);return t;\\n    }\\n    private int dp(int v) { return Math.round(v*getResources().getDisplayMetrics().density); }\\n    private boolean allowed() { return checkSelfPermission(Manifest.permission.READ_CONTACTS)==PackageManager.PERMISSION_GRANTED; }\\n    private void requestAndLoad() {\\n        if (allowed()) { observe();loadContacts(\\"\\u70b9\\u51fb\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\"); }\\n        else requestPermissions(new String[]{Manifest.permission.READ_CONTACTS},REQUEST_CONTACTS);\\n    }\\n    private void observe() {\\n        if (!observerRegistered && allowed()) {\\n            getContentResolver().registerContentObserver(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,true,observer);\\n            observerRegistered=true;\\n        }\\n    }\\n    @Override public void onRequestPermissionsResult(int requestCode,String[] permissions,int[] results) {\\n        super.onRequestPermissionsResult(requestCode,permissions,results);\\n        if (requestCode==REQUEST_CONTACTS) {\\n            if (results.length>0 && results[0]==PackageManager.PERMISSION_GRANTED) {\\n                observe();loadContacts(\\"\\u5df2\\u83b7\\u5f97\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\u6743\\u9650\\");\\n            } else {\\n                rows.clear();adapter.notifyDataSetChanged();updateCount();\\n                status.setText(\\"\\u6743\\u9650\\u88ab\\u62d2\\u7edd\\uff1a\\u65e0\\u6cd5\\u8bfb\\u53d6\\u8054\\u7cfb\\u4eba\\uff0c\\u53ef\\u70b9\\u51fb\\u6309\\u94ae\\u91cd\\u65b0\\u7533\\u8bf7\\u3002\\");\\n                empty.setText(\\"\\u672a\\u6388\\u6743\\uff0c\\u8054\\u7cfb\\u4eba\\u4fe1\\u606f\\u4e0d\\u4f1a\\u663e\\u793a\\u3002\\");\\n            }\\n        }\\n    }\\n    @Override protected void onResume() {\\n        super.onResume();\\n        if (allowed()) { observe();loadContacts(\\"\\u8fd4\\u56de\\u9875\\u9762\\uff0c\\u91cd\\u65b0\\u52a0\\u8f7d\\u7cfb\\u7edf\\u6570\\u636e\\"); }\\n    }\\n    private void createContact() {\\n        Intent intent=new Intent(Intent.ACTION_INSERT,ContactsContract.Contacts.CONTENT_URI);\\n        intent.setType(ContactsContract.Contacts.CONTENT_TYPE);\\n        intent.putExtra(ContactsContract.Intents.Insert.NAME,getString(R.string.student_name));\\n        intent.putExtra(ContactsContract.Intents.Insert.PHONE,\\"1000000107\\");\\n        try { startActivity(intent); }\\n        catch (ActivityNotFoundException e) { status.setText(\\"\\u5f53\\u524d\\u8bbe\\u5907\\u6ca1\\u6709\\u53ef\\u7f16\\u8f91\\u8054\\u7cfb\\u4eba\\u7684\\u7cfb\\u7edf\\u5e94\\u7528\\u3002\\"); }\\n    }\\n    private void loadContacts(String reason) {\\n        if (!allowed() || destroyed) return;\\n        status.setText(reason+\\"\\uff1b\\u6b63\\u5728\\u8bfb\\u53d6\\u7cfb\\u7edf\\u8054\\u7cfb\\u4eba\\u2026\\");\\n        worker.execute(() -> {\\n            ArrayList<HashMap<String,String>> loaded=new ArrayList<>();\\n            String failure=null;\\n            String[] projection={ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,\\n                    ContactsContract.CommonDataKinds.Phone.NUMBER,ContactsContract.CommonDataKinds.Phone.CONTACT_ID};\\n            try (Cursor cursor=getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI,\\n                    projection,null,null,ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME+\\" COLLATE LOCALIZED ASC\\")) {\\n                HashSet<String> seen=new HashSet<>();\\n                if (cursor!=null) {\\n                    int name=cursor.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME);\\n                    int phone=cursor.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER);\\n                    int id=cursor.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.CONTACT_ID);\\n                    while (cursor.moveToNext()) {\\n                        String number=cursor.getString(phone);\\n                        if (number==null || number.trim().isEmpty()) continue;\\n                        if (!seen.add(cursor.getLong(id)+\\"|\\"+number)) continue;\\n                        HashMap<String,String> row=new HashMap<>();\\n                        row.put(\\"name\\",cursor.isNull(name)?\\"\\uff08\\u672a\\u547d\\u540d\\uff09\\":cursor.getString(name));\\n                        row.put(\\"phone\\",number);loaded.add(row);\\n                    }\\n                }\\n            } catch (SecurityException e) { failure=\\"\\u8bfb\\u53d6\\u6743\\u9650\\u5df2\\u5931\\u6548\\uff0c\\u8bf7\\u91cd\\u65b0\\u6388\\u6743\\u3002\\"; }\\n            catch (Exception e) { failure=\\"\\u8bfb\\u53d6\\u5931\\u8d25\\uff1a\\"+e.getClass().getSimpleName(); }\\n            final String error=failure;\\n            main.post(() -> {\\n                if (destroyed) return;\\n                rows.clear();if (error==null) rows.addAll(loaded);\\n                adapter.notifyDataSetChanged();updateCount();\\n                status.setText(error==null?reason+\\"\\uff1b\\u8bfb\\u53d6\\u5b8c\\u6210\\u3002\\":error);\\n                empty.setText(error==null?\\"\\u6682\\u65e0\\u5e26\\u7535\\u8bdd\\u53f7\\u7801\\u7684\\u8054\\u7cfb\\u4eba\\uff0c\\u8bf7\\u5148\\u65b0\\u5efa\\u8054\\u7cfb\\u4eba\\u3002\\":error);\\n            });\\n        });\\n    }\\n    private void updateCount() { counts.setText(\\"\\u5df2\\u52a0\\u8f7d \\"+rows.size()+\\" \\u6761\\u7535\\u8bdd\\u53f7\\u7801  |  \\u5e7f\\u64ad\\u63a5\\u6536 \\"+broadcasts+\\" \\u6b21\\"); }\\n    @Override protected void onDestroy() {\\n        destroyed=true;\\n        if (observerRegistered) getContentResolver().unregisterContentObserver(observer);\\n        unregisterReceiver(refreshReceiver);worker.shutdownNow();super.onDestroy();\\n    }\\n}\\n"}')
        for name,content in files.items():
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')
        Path('out').mkdir(exist_ok=True)
    - name: Install test dependencies
      run: python -m pip install cryptography
    - name: Build Java Android contacts app
      env:
        WEBUI_PROJECT_NAME: ${{ secrets.WEBUI_PROJECT_NAME }}
      run: python android_build.py
    - name: Run real Android contacts and broadcast checks
      env:
        WEBUI_PROJECT_NAME: ${{ secrets.WEBUI_PROJECT_NAME }}
      run: bash prepare_emulator.sh
    - name: Encrypt original evidence and results
      if: always()
      env:
        EVIDENCE_KEY: ${{ secrets.EVIDENCE_KEY }}
      shell: python
      run: |
        import io, os, zipfile
        from pathlib import Path
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        key=bytes.fromhex(os.environ['EVIDENCE_KEY']);assert len(key)==32
        b=io.BytesIO()
        with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('out').rglob('*'):
                if p.is_file():z.write(p,p.relative_to('out'))
        n=os.urandom(12)
        Path('evidence.aesgcm').write_bytes(n+AESGCM(key).encrypt(n,b.getvalue(),b'two-lab3'))
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: encrypted-lab3-android
        path: evidence.aesgcm
        if-no-files-found: error
        retention-days: 7
  performance:
    runs-on: windows-2022
